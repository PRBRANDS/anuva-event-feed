name: Anuva Eventbrite free events import

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"   # every day around 10:30 AM EST

permissions:
  contents: write

concurrency:
  group: anuva-event-feed-writer
  cancel-in-progress: false

jobs:
  import-free-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Anuva event feed
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import free Eventbrite events
        env:
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
        run: python scripts/import_eventbrite_free.py

      - name: Commit feed updates
        run: |
          if ! git diff --quiet -- events.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Import free Eventbrite events"
            git push
          else
            echo "No free-event changes."
          fi
